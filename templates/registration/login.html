{% extends "base.html" %}
{% block title %}HR 로그인{% endblock %}
{% block content %}
<div style="max-width: 320px; margin: 64px auto 0;">
  <h1>HR 로그인</h1>
  <p style="margin-bottom: 24px;">지원자 리포트를 확인하려면 로그인하세요.</p>
  {% if form.errors %}
    <p style="color: #e5484d; font-size: 14px;">아이디 또는 비밀번호가 올바르지 않습니다.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom: 16px;">
      <label for="{{ form.username.id_for_label }}">아이디</label>
      {{ form.username }}
    </div>
    <div style="margin-bottom: 24px;">
      <label for="{{ form.password.id_for_label }}">비밀번호</label>
      {{ form.password }}
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%;">로그인</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}
