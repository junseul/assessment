{% load static %}<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전략게임 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/lightdash.css' %}">
</head>
<body class="game-hub-page">
<main class="game-hub">
  <header class="game-hub-heading">
    <span class="game-hub-eyebrow">STRATEGY GAME</span>
    <h1>테스트할 게임을 선택하세요</h1>
    <p>확인할 전략게임을 선택하면 테스트가 바로 시작됩니다.</p>
  </header>
  <div class="game-select-grid">
    {% for game in games %}
    <a class="game-select-card" href="{% url 'games:play' game.slug %}">
      <span class="game-select-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">{{ game.icon_svg|safe }}</svg></span>
      <strong>{{ game.title }}</strong>
      <span class="game-select-status">테스트 가능</span>
    </a>
    {% endfor %}
  </div>
</main>
</body>
</html>
